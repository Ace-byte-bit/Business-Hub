<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse remote jobs across Rwanda — only verified employers and workers.">
  <title>Remote Jobs — Business Hub Rwanda</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-root="../">

  <header class="site-header">
    <a href="../index.html" class="brand">← Business Hub <span>Rwanda</span></a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html" class="active">Find Jobs</a>
      <a href="../employers/index.html">Hire / Advertise</a>
      <a href="../verify/index.html">Verify Identity</a>
    </nav>
    <div id="identityBadge" class="identity-badge"></div>
  </header>

  <main class="page">

    <section class="jobs-hero">
      <h1>Remote jobs for Rwandans</h1>
      <p>Every employer here is verified. Apply from anywhere in the country.</p>
      <div id="verifyPrompt" class="verify-prompt" hidden>
        <span>⚠️ You're not verified yet. Verified workers can apply.</span>
        <a href="../verify/index.html" class="btn btn-primary">Verify now</a>
      </div>
    </section>

    <section class="filters">
      <input type="search" id="searchInput" placeholder="🔍 Search jobs by title or company…" aria-label="Search jobs">
      <select id="categoryFilter" aria-label="Filter by category">
        <option value="all">All categories</option>
        <option value="Support">Support</option>
        <option value="Technology">Technology</option>
        <option value="Operations">Operations</option>
        <option value="Marketing">Marketing</option>
        <option value="Education">Education</option>
        <option value="Admin">Admin</option>
      </select>
    </section>

    <p class="results-count" id="resultsCount" aria-live="polite"></p>
    <div id="jobsList" class="job-grid"></div>

  </main>

  <footer class="site-footer">
    <nav aria-label="Footer">
      <a href="../about.html">About &amp; Trust</a>
      <a href="index.html">Jobs</a>
      <a href="../employers/index.html">Advertise</a>
    </nav>
    <p>© <span id="year"></span> CL.Connect Rwanda</p>
  </footer>

  <script src="../shared/ui.js"></script>
  <script src="../shared/identity.js"></script>
  <script src="../shared/jobs-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
